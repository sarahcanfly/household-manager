name: Test and deploy

# Every push to main: run the tests, then (once the Supabase secrets are added)
# update the database and the server functions. The phone app itself is
# published by Netlify straight from the web/ folder.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@6.0.3
      - name: Type-check, unit tests, database tests
        run: sh scripts/test.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase secrets not added yet; skipping deploy. See SETUP.md step 2."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Update database
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --include-all
      - name: Deploy server functions
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"

  # Every family's own copy gets the same update. Each family is a GitHub environment
  # (Settings → Environments) holding its SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD;
  # deploy/families.json lists the environment names, e.g. ["smith", "lee"].
  families:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "list=$(jq -c '[.[] | select(type == "string" and test("^[a-z0-9-]+$"))]' deploy/families.json)" >> "$GITHUB_OUTPUT"

  deploy-family:
    needs: families
    if: needs.families.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJson(needs.families.outputs.list) }}
    environment: ${{ matrix.family }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link ${{ matrix.family }}
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Update ${{ matrix.family }} database
        run: supabase db push --include-all
      - name: Deploy ${{ matrix.family }} server functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
